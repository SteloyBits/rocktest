<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>News Stories</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.6; background: #fff; color: #111; }
    a { color: inherit; text-decoration: none; }
    header { padding: 1rem; border-bottom: 1px solid #e5e5e5; background: #fff; position: sticky; top: 0; z-index: 10; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 1rem; }
    main { max-width: 1000px; margin: 0 auto; padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.2rem; }
    .card { border: 1px solid #e8e8e8; border-radius: 10px; overflow: hidden; background: #fff; transition: box-shadow .2s ease, transform .02s ease; }
    .card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.06); }
    .thumb { width: 100%; height: 160px; object-fit: cover; display: block; background: #f2f2f2; }
    .content { padding: 1rem; }
    .title { margin: 0 0 .4rem; font-size: 1.15rem; line-height: 1.3; }
    .excerpt { color: #444; font-size: .95rem; margin: .4rem 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tags { color: #666; font-size: .85rem; margin-top: .4rem; }
    .chip { display: inline-block; background: #f5f7fa; color: #333; border: 1px solid #e7ebf0; border-radius: 999px; padding: .15rem .6rem; margin-right: .4rem; margin-bottom: .4rem; font-size: .8rem; }
    .empty { text-align: center; padding: 3rem 1rem; color: #666; }
    .detail { max-width: 800px; margin: 0 auto; }
    .detail h1 { margin: .5rem 0 0.75rem; font-size: 2rem; line-height: 1.2; }
    .detail .hero { width: 100%; max-height: 420px; object-fit: cover; border-radius: 8px; background: #f2f2f2; }
    .detail .body { font-size: 1.05rem; color: #222; margin-top: 1.5rem; }
    .detail .body h1, .detail .body h2, .detail .body h3 { margin-top: 1.5rem; margin-bottom: 0.75rem; }
    .detail .body p { margin-bottom: 1rem; }
    .detail .body ul, .detail .body ol { margin-bottom: 1rem; padding-left: 1.5rem; }
    .detail .body li { margin-bottom: 0.5rem; }
    .detail .body blockquote { border-left: 4px solid #e5e5e5; padding-left: 1rem; margin-left: 0; color: #666; font-style: italic; }
    .detail .body img { max-width: 100%; height: auto; border-radius: 4px; }
    .detail .body code { background: #f5f7fa; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: monospace; }
    .detail .body pre { background: #f5f7fa; padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1rem; }
    .back { display: inline-block; margin: .2rem 0 1rem; color: #0a58ca; }
    .pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e8e8e8; }
    .pager-link { padding: .65rem .9rem; border: 1px solid #dfe5ec; border-radius: 999px; background: #fff; color: #111; }
    .pager-link[aria-disabled="true"] { opacity: .45; pointer-events: none; }
    .comments { margin-top: 2rem; padding: 1.25rem; border: 1px solid #e8e8e8; border-radius: 14px; background: linear-gradient(180deg, #ffffff 0%, #fafbfc 100%); }
    .comments-header { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; margin-bottom: 1rem; }
    .comments-title { margin: 0; font-size: 1.2rem; }
    .comments-note { margin: 0; color: #666; font-size: .92rem; }
    .comments-list { display: grid; gap: .85rem; margin-bottom: 1rem; }
    .comment { border: 1px solid #e8e8e8; border-radius: 12px; padding: .9rem 1rem; background: #fff; }
    .comment-meta { display: flex; justify-content: space-between; gap: 1rem; align-items: center; margin-bottom: .35rem; color: #666; font-size: .85rem; }
    .comment-author { font-weight: 650; color: #111; }
    .comment-text { margin: 0; white-space: pre-wrap; color: #222; }
    .comment-pending { display: inline-flex; align-items: center; border-radius: 999px; background: #fff8e6; color: #8a6200; padding: .15rem .5rem; font-size: .75rem; border: 1px solid #f3dd9c; }
    .comments-empty, .comments-status { color: #666; font-size: .92rem; }
    .comment-form { display: grid; gap: .9rem; margin-top: 1rem; }
    .comment-form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; }
    .comment-form label { display: grid; gap: .35rem; font-size: .9rem; color: #333; }
    .comment-form input, .comment-form textarea { width: 100%; border: 1px solid #d8dfe6; border-radius: 10px; padding: .75rem .85rem; font: inherit; background: #fff; }
    .comment-form textarea { min-height: 120px; resize: vertical; grid-column: 1 / -1; }
    .comment-form-actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .comment-button { border: 0; border-radius: 999px; padding: .8rem 1.1rem; background: #111; color: #fff; font-weight: 650; cursor: pointer; }
    .comment-button:disabled { opacity: .6; cursor: not-allowed; }
    @media (max-width: 720px) {
      .comment-form-grid { grid-template-columns: 1fr; }
      .comments-header, .comment-form-actions { flex-direction: column; align-items: stretch; }
      .pager { flex-direction: column; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>News Stories</h1>
    </div>
  </header>
  <main>
    <div id="list-view">
      <div id="list" class="grid"></div>
      <div id="empty" class="empty" hidden>No stories yet.</div>
    </div>
    <div id="detail-view" class="detail" hidden>
      <a id="back-link" class="back" href="#/">← Back to stories</a>
      <h1 id="d-title"></h1>
      <div id="d-tags"></div>
      <img id="d-image" class="hero" alt="">
      <div id="d-body" class="body"></div>
      <div id="pager" class="pager">
        <a id="prev-link" class="pager-link" href="#/" aria-disabled="true">Previous story</a>
        <a id="next-link" class="pager-link" href="#/" aria-disabled="true">Next story</a>
      </div>
      <section id="comments-section" class="comments" hidden>
        <div class="comments-header">
          <div>
            <h2 class="comments-title" id="comments-title">Comments</h2>
            <p class="comments-note">Comments are reviewed before they appear publicly.</p>
          </div>
        </div>
        <div id="comments-list" class="comments-list"></div>
        <div id="comments-empty" class="comments-empty" hidden>No approved comments yet.</div>
        <form id="comment-form" class="comment-form">
          <div class="comment-form-grid">
            <label>
              Name
              <input id="comment-author" name="author" type="text" maxlength="120" autocomplete="name" placeholder="Your name" required>
            </label>
            <label>
              Email
              <input id="comment-email" name="email" type="email" maxlength="200" autocomplete="email" placeholder="name@example.com" required>
            </label>
            <label>
              Website
              <input id="comment-url" name="url" type="url" maxlength="500" placeholder="https://example.com">
            </label>
            <label style="grid-column: 1 / -1;">
              Comment
              <textarea id="comment-text" name="text" maxlength="4000" required placeholder="Write your comment..."></textarea>
            </label>
          </div>
          <div class="comment-form-actions">
            <button id="comment-submit" class="comment-button" type="submit">Post comment</button>
            <div id="comment-status" class="comments-status" aria-live="polite"></div>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script>
    let cachedStories = null;
    const pendingCommentsByPath = new Map();
    const approvedCommentsByPath = new Map();
    let currentCommentPath = '';
    async function fetchStoriesData() {
      const sources = ['/api/stories', 'data.json'];
      for (const url of sources) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) continue;
          const data = await res.json();
          if (Array.isArray(data)) {
            return data;
          }
        } catch (e) {}
      }
      return [];
    }
    function showListView() {
      document.getElementById('list-view').hidden = false;
      document.getElementById('detail-view').hidden = true;
    }
    function showDetailView() {
      document.getElementById('list-view').hidden = true;
      document.getElementById('detail-view').hidden = false;
    }

    function getCommentPath(slug) {
      return `story:${slug || ''}`;
    }

    function setCommentStatus(message, isError = false) {
      const status = document.getElementById('comment-status');
      status.textContent = message || '';
      status.style.color = isError ? '#a21d1d' : '#666';
    }

    function formatCommentDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString([], {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    function getPendingComments(path) {
      return pendingCommentsByPath.get(path) || [];
    }

    function renderComment(comment, pending = false) {
      const wrapper = document.createElement('article');
      wrapper.className = 'comment';

      const meta = document.createElement('div');
      meta.className = 'comment-meta';

      const author = document.createElement('span');
      author.className = 'comment-author';
      const authorName = comment.author_name || comment.author || '';
      author.textContent = authorName.trim() ? authorName : 'Anonymous';

      const time = document.createElement('span');
      time.textContent = formatCommentDate(comment.created_at || comment.createdAt) || 'Just now';

      meta.appendChild(author);
      meta.appendChild(time);

      if (pending) {
        const badge = document.createElement('span');
        badge.className = 'comment-pending';
        badge.textContent = 'Pending moderation';
        meta.appendChild(badge);
      }

      const text = document.createElement('p');
      text.className = 'comment-text';
      text.textContent = comment.content || comment.text || '';

      wrapper.appendChild(meta);
      wrapper.appendChild(text);
      return wrapper;
    }

    function renderComments(path, comments) {
      const section = document.getElementById('comments-section');
      const list = document.getElementById('comments-list');
      const empty = document.getElementById('comments-empty');
      section.hidden = false;
      list.innerHTML = '';

      const pending = getPendingComments(path);
      const approved = Array.isArray(comments) ? comments : (approvedCommentsByPath.get(path) || []);
      const items = [...pending.map((comment) => ({ comment, pending: true })), ...approved.map((comment) => ({ comment, pending: false }))];

      if (items.length === 0) {
        empty.hidden = false;
        empty.textContent = 'No approved comments yet.';
        return;
      }

      empty.hidden = true;
      for (const item of items) {
        list.appendChild(renderComment(item.comment, item.pending));
      }
    }

    async function loadComments(path) {
      currentCommentPath = path;
      const section = document.getElementById('comments-section');
      const empty = document.getElementById('comments-empty');
      const list = document.getElementById('comments-list');
      section.hidden = false;
      list.innerHTML = '';
      empty.hidden = false;
      empty.textContent = 'Loading comments...';
      try {
        const res = await fetch('/api/stories/' + encodeURIComponent(path) + '/comments', { cache: 'no-store' });
        let comments = [];
        if (res.ok) {
          comments = await res.json();
        } else {
          throw new Error(await readApiError(res));
        }
        approvedCommentsByPath.set(path, Array.isArray(comments) ? comments : []);
        renderComments(path, Array.isArray(comments) ? comments : []);
      } catch (error) {
        console.error('Failed to load comments:', error);
        empty.hidden = false;
        empty.textContent = error.message ? `Failed to load comments: ${error.message}` : 'Failed to load comments.';
      }
    }

    function resetCommentForm() {
      document.getElementById('comment-author').value = '';
      document.getElementById('comment-email').value = '';
      document.getElementById('comment-url').value = '';
      document.getElementById('comment-text').value = '';
    }

    function addPendingComment(path, comment) {
      const pending = getPendingComments(path).slice();
      pending.unshift(comment);
      pendingCommentsByPath.set(path, pending);
    }

    async function readApiError(response) {
      const rawText = await response.text();
      if (!rawText) {
        return `Request failed with status ${response.status}`;
      }

      try {
        const parsed = JSON.parse(rawText);
        if (parsed && typeof parsed.error === 'string' && parsed.error.trim()) {
          return parsed.error;
        }
        if (parsed && typeof parsed.message === 'string' && parsed.message.trim()) {
          return parsed.message;
        }
      } catch (error) {}

      return rawText;
    }
    function buildCard(s) {
      const a = document.createElement('a');
      a.href = '#/story/' + encodeURIComponent(s.slug || '');
      const card = document.createElement('article');
      card.className = 'card';
      const img = document.createElement('img');
      img.className = 'thumb';
      if (s.image_url) {
        img.src = s.image_url;
        img.alt = s.excerpt || s.headline || 'story image';
      } else {
        img.alt = 'no image';
        img.style.display = 'none';
      }
      const content = document.createElement('div');
      content.className = 'content';
      const h2 = document.createElement('div');
      h2.className = 'title';
      h2.textContent = s.headline || '';
      const tags = document.createElement('div');
      tags.className = 'tags';
      if (Array.isArray(s.tags) && s.tags.length > 0) {
        tags.textContent = s.tags.join(' · ');
      } else {
        tags.textContent = '';
      }
      const excerpt = document.createElement('div');
      excerpt.className = 'excerpt';
      let ex = s.excerpt && s.excerpt.trim() ? s.excerpt : (s.body || '').slice(0, 200);
      // Basic markdown strip for excerpt
      ex = ex.replace(/[#*`_\[\]()]/g, '');
      excerpt.textContent = ex;
      content.appendChild(h2);
      content.appendChild(excerpt);
      content.appendChild(tags);
      card.appendChild(img);
      card.appendChild(content);
      a.appendChild(card);
      return a;
    }
    async function loadStories() {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      list.innerHTML = '';
      try {
        if (!cachedStories) {
          cachedStories = await fetchStoriesData();
        }
        const items = Array.isArray(cachedStories) ? cachedStories : [];
        if (items.length === 0) {
          empty.hidden = false;
          return;
        }
        empty.hidden = true;
        for (const s of items) {
          list.appendChild(buildCard(s));
        }
      } catch (e) {
        empty.hidden = false;
        empty.textContent = 'Failed to load stories.';
      }
    }
    async function loadStory(slug) {
      try {
        let s = null;
        try {
          const res = await fetch('/api/stories/' + encodeURIComponent(slug), { cache: 'no-store' });
          if (res.ok) {
            s = await res.json();
          }
        } catch (e) {}

        if (!s) {
          if (!cachedStories) {
            cachedStories = await fetchStoriesData();
          }
          s = Array.isArray(cachedStories)
            ? cachedStories.find((item) => (item.slug || '') === (slug || ''))
            : null;
        }

        if (!s) throw new Error('Not found');
        document.getElementById('d-title').textContent = s.headline || '';
        const tagsWrap = document.getElementById('d-tags');
        tagsWrap.innerHTML = 'tags: ';
        if (Array.isArray(s.tags)) {
          for (const t of s.tags) {
            const el = document.createElement('span');
            el.className = 'chip';
            el.textContent = t;
            tagsWrap.appendChild(el);
          }
        }
        const img = document.getElementById('d-image');
        if (s.image_url) {
          // const fixedUrl = String(s.image_url).replace('download', 'view');
          img.src = s.image_url;
          // img.src = "https://drive.google.com/uc?id=1U51LlSL2XaSrE_2Q12-tO_PAgEFWgX79&export=download"
          img.alt = s.excerpt || s.headline || 'story image';
          img.style.display = '';
        } else {
          img.removeAttribute('src');
          img.alt = '';
          img.style.display = 'none';
        }
        const bodyEl = document.getElementById('d-body');
        if (typeof marked !== 'undefined') {
          bodyEl.innerHTML = marked.parse(s.body || '');
        } else {
          bodyEl.textContent = s.body || '';
          bodyEl.style.whiteSpace = 'pre-wrap';
        }
        if (!cachedStories) {
          try {
            cachedStories = await fetchStoriesData();
          } catch {}
        }
        const prevLink = document.getElementById('prev-link');
        const nextLink = document.getElementById('next-link');
        let prev = null, next = null;
        if (Array.isArray(cachedStories)) {
          const idx = cachedStories.findIndex((x) => (x.slug || '') === (s.slug || ''));
          if (idx !== -1) {
            prev = idx < cachedStories.length - 1 ? cachedStories[idx + 1] : null;
            next = idx > 0 ? cachedStories[idx - 1] : null;
          }
        }
        if (prev && prev.slug) {
          prevLink.href = '#/story/' + encodeURIComponent(prev.slug);
          prevLink.setAttribute('aria-disabled', 'false');
        } else {
          prevLink.href = '#/';
          prevLink.setAttribute('aria-disabled', 'true');
        }
        if (next && next.slug) {
          nextLink.href = '#/story/' + encodeURIComponent(next.slug);
          nextLink.setAttribute('aria-disabled', 'false');
        } else {
          nextLink.href = '#/';
          nextLink.setAttribute('aria-disabled', 'true');
        }
        document.getElementById('comments-title').textContent = (s.headline || 'Story') + ' comments';
        await loadComments(String(s.id || s.slug || slug || ''));
        setCommentStatus('');
        showDetailView();
      } catch (e) {
        location.hash = '#/';
      }
    }
    function router() {
      const hash = location.hash || '#/';
      if (hash.startsWith('#/story/')) {
        const slug = decodeURIComponent(hash.slice('#/story/'.length));
        loadStory(slug);
      } else {
        showListView();
        loadStories();
      }
    }
    document.getElementById('comment-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const submit = document.getElementById('comment-submit');
      const text = document.getElementById('comment-text').value.trim();
      const author = document.getElementById('comment-author').value.trim();
      const email = document.getElementById('comment-email').value.trim();
      const url = document.getElementById('comment-url').value.trim();

      if (!currentCommentPath) {
        setCommentStatus('Open a story before posting a comment.', true);
        return;
      }
      if (!text) {
        setCommentStatus('Comment text is required.', true);
        return;
      }
      if (!author) {
        setCommentStatus('Your name is required.', true);
        return;
      }
      if (!email) {
        setCommentStatus('Your email is required.', true);
        return;
      }

      submit.disabled = true;
      setCommentStatus('Posting your comment...');

      try {
        const res = await fetch('/api/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            story_id: currentCommentPath,
            author_name: author,
            author_email: email,
            content: text,
          }),
        });
        if (!res.ok) {
          throw new Error(await readApiError(res));
        }

        const payload = await res.json().catch(() => ({}));

        addPendingComment(currentCommentPath, {
          author_name: author,
          author_email: email,
          content: text,
          created_at: new Date().toISOString(),
        });
        renderComments(currentCommentPath);
        resetCommentForm();
        setCommentStatus(payload.message || 'Thanks. Your comment is awaiting moderation.');
      } catch (error) {
        console.error('Failed to post comment:', error);
        setCommentStatus(error.message || 'Failed to post comment.', true);
      } finally {
        submit.disabled = false;
      }
    });
    window.addEventListener('hashchange', router);
    router();
  </script>
</body>
</html>
